# Backup semanal do banco (Supabase), criptografado.
# Precisa dos segredos SUPABASE_DB_URL e BACKUP_PASSPHRASE (veja docs/CONFIGURACAO.md).
name: Backup do banco
on:
  schedule:
    - cron: '0 6 * * 0'   # domingo, 3h da manhã em Brasília
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir segredos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::error::Configure os segredos SUPABASE_DB_URL e BACKUP_PASSPHRASE (docs/CONFIGURACAO.md, passo 7)."; exit 1
          fi
      - name: Gerar cópia
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir dump && cd dump
          npx --yes supabase@3.3.0 db dump --db-url "$DB" -f roles.sql --role-only
          npx --yes supabase@3.3.0 db dump --db-url "$DB" -f schema.sql
          npx --yes supabase@3.3.0 db dump --db-url "$DB" -f data.sql --use-copy --data-only \
            -x storage.buckets_vectors,storage.vector_indexes,storage.buckets_analytics,storage.iceberg_namespaces,storage.iceberg_tables
          ls -la
      - name: Criptografar
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf backup.tar.gz -C dump .
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o backup.tar.gz.gpg backup.tar.gz
          rm -rf dump backup.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backup.tar.gz.gpg
          retention-days: 90
